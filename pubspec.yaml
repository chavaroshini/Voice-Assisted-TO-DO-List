name: voice_todo_app
description: A Flutter to-do list application with voice assistance.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=2.19.0 <3.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  speech_to_text: ^6.1.1
  flutter_tts: ^3.6.3
  shared_preferences: ^2.1.1
  intl: ^0.18.0
  flutter_slidable: ^3.0.0
  provider: ^6.0.5
  google_fonts: ^4.0.3
  flutter_animate: ^4.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true